<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | Khushi Gupta</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <h1 class="logo">Khushi Gupta</h1>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="skills.html">Skills</a></li>

            <li><a href="projects.html">Projects</a></li>

            <li><a href="contact.html">Contact</a></li>
           

        </ul>

        <button id="themeBtn">🌙</button>

    </nav>

</header>

<main>

<section class="shop-section">

    <h2>Shop</h2>

    <p class="shop-text">
        Browse products, search items and add them to your cart.
    </p>

    <!-- Search -->
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
    >

    <!-- Category Buttons -->
    <div class="category-buttons">

        <button class="category-btn active" data-category="all">All</button>

        <button class="category-btn" data-category="electronics">Electronics</button>

        <button class="category-btn" data-category="jewelery">Jewellery</button>

        <button class="category-btn" data-category="men's clothing">Men</button>

        <button class="category-btn" data-category="women's clothing">Women</button>

    </div>

    <!-- Products -->
    <div id="productContainer" class="products-container">

    </div>

</section>

</main>

<footer>

<p>© 2026 Khushi Gupta</p>

</footer>

<script src="js/script.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
